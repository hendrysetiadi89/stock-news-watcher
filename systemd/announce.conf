# Drop-in untuk hermes-gateway.service.
# Pasang di: ~/.config/systemd/user/hermes-gateway.service.d/announce.conf
#
# Mengirim "Radar saham aktif" ke Telegram tepat setelah gateway menyala --
# saat WSL boot, saat gateway restart, kapan pun service ini start.
#
# Awalan '-' berarti kegagalan diabaikan: kalau Telegram sedang tidak bisa
# dihubungi, gateway tetap dianggap berhasil start.
# 'timeout 60' mencegah hook menggantung start-up service.

[Service]
ExecStartPost=-/usr/bin/timeout 60 /usr/bin/python3 %h/.hermes/skills/stock-news-watcher/watch.py --telegram --announce
